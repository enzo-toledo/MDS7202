[project]
name = "chaucherapp-backend"
version = "0.1.0"
description = "API FastAPI para la priorización de tickets de ChaucherApp"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.9",
    "langchain-google-genai>=2.0",
    "python-dotenv>=1.0",
    "pandas<3",
    "scikit-learn==1.8.0",
    "cloudpickle>=3.0",
]

[tool.uv]
package = false
